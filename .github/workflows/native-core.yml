name: Native game core checks
# On main the installable build already compiles and runs every one of these tests on
# all four platforms, so this matrix runs only for pull requests.
on:
  # Pull requests only: the release takes these results from the merged pull request's
  # run (tools/test_reuse.py collect), and the application jobs test the same cores.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read  # tools/test_reuse.py reads earlier runs' results
concurrency:
  group: core-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
      # GUI.Forms publishes the MSYS2 tree its cache was compiled with; restoring it
      # avoids the MSYS2 mirrors and guarantees the compiler the cache needs.
      - name: Restore GUI.Forms' Windows toolchain
        id: msys
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/restore_windows_toolchain.py
      # Only when the published toolchain could not be restored.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.msys.outputs.restored != 'true'
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm-tools mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja git
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure the complete portable game core
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAMES_BUILD_APPLICATION=OFF
      - name: Build
        run: cmake --build build --parallel 4
      # Tests whose inputs are unchanged since they last passed are not run again
      # (tools/test_reuse.py). Every release carries the results; each run starts from
      # the newest release's.
      - name: Fetch test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py tools/test_reuse.py fetch --results .build/test-results/test-results-core-${{ matrix.platform }}.json
      - name: Plan tests
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py tools/test_reuse.py plan --build build --profile core-${{ matrix.platform }} \
            --results .build/test-results/test-results-core-${{ matrix.platform }}.json --exclude .build/test-results/exclude.txt
      - name: Test rules and storage
        run: |
          skip=$(cat .build/test-results/exclude.txt 2>/dev/null || true)
          ctest --test-dir build --output-on-failure --timeout 180 --parallel 4 --output-junit results.xml --no-tests=ignore ${skip:+-E "$skip"}
      - name: Record test results
        if: always()
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py tools/test_reuse.py record --build build --profile core-${{ matrix.platform }} \
            --results .build/test-results/test-results-core-${{ matrix.platform }}.json --junit build/results.xml
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-core-${{ matrix.platform }}
          path: .build/test-results/test-results-core-${{ matrix.platform }}.json
          if-no-files-found: ignore
      - name: Render replacement game scenes
        run: |
          mkdir -p build/previews
          build/atomprobe_preview play build/previews/atomprobe-play.ppm
          build/atomprobe_preview reveal build/previews/atomprobe-reveal.ppm
          build/fourpegs_preview pose build/previews/fourpegs-pose.ppm
          build/switchbox_preview pose build/previews/switchbox-pose.ppm
          build/raster_tests build/previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-checks-${{ matrix.platform }}
          path: |
            build/results.xml
            build/Testing/Temporary/LastTest.log
            build/previews/*.ppm
          if-no-files-found: warn
