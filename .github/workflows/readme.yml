name: README game list
# Every game's entry on the repository's front page comes from its own folder
# (GAME.json, about.md and screens/readme.jpg) through tools/make_readme.py.
# A pull request that changes a game folder runs the tool and commits the list
# with it; this check fails when README.md is not what the tool makes. Nothing
# pushes to main: every change arrives through a pull request, so branch
# protection can require this check. It runs on every pull request, because a
# required check that a path filter skips would block the merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: readme-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the game list against the game folders
        run: python3 tools/make_readme.py --check
