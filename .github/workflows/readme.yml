name: Refresh the README game list
# Every game's entry on the repository's front page comes from its own folder
# (GAME.json, about.md, screens/readme.jpg). After a push that changes any of
# them, regenerate the list and commit it back, so adding a game folder is all
# it takes to put the game on the front page. README-only commits do not start
# the application build (applications.yml ignores *.md).
on:
  push:
    branches: [main]
    paths: ['games/**', 'tools/make_readme.py', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the game list
        run: python3 tools/make_readme.py
      - name: Commit it if it changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh the README game list"
          git pull --rebase origin main
          git push origin HEAD:main
