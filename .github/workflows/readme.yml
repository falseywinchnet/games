name: README game list
# Every game's entry on the repository's front page comes from its own folder
# (GAME.json, about.md and screens/readme.jpg) through tools/make_readme.py.
# A pull request that changes a game folder runs the tool and commits the list
# with it; this check fails when README.md is not what the tool makes. Nothing
# pushes to main: every change arrives through a pull request. It runs on every
# pull request, as part of applications.yml, whose "PlaySuite CI summary" job is
# the check branch protection requires.
on:
  # Called by applications.yml, whose "PlaySuite CI summary" job stands for every check
  # of a pull request; run by hand from the Actions tab.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the game list against the game folders
        run: python3 tools/make_readme.py --check
