name: Runtime assets and portable audio
on:
  push:
    branches: [main]
    paths:
      # GUI.Forms Audio as an outside consumer. The application jobs already decode every
      # prepared asset (tests/audio_tests.cpp), so assets and new games don't need this.
      - 'src/*audio*'
      - 'src/pcm_player.*'
      - 'tests/portable_audio/**'
      - 'tests/*audio*'
      - 'games/eggy/**'
      - 'games/fourpegs/**'
      - 'games/atomprobe/**'
      - 'games/switchbox/**'
      - 'tools/restore_*.py'
      - 'tools/package_common.py'
      - '.github/workflows/runtime-assets.yml'
  pull_request:
    paths:
      # GUI.Forms Audio as an outside consumer. The application jobs already decode every
      # prepared asset (tests/audio_tests.cpp), so assets and new games don't need this.
      - 'src/*audio*'
      - 'src/pcm_player.*'
      - 'tests/portable_audio/**'
      - 'tests/*audio*'
      - 'games/eggy/**'
      - 'games/fourpegs/**'
      - 'games/atomprobe/**'
      - 'games/switchbox/**'
      - 'tools/restore_*.py'
      - 'tools/package_common.py'
      - '.github/workflows/runtime-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read  # tools/test_reuse.py reads earlier runs' results
concurrency:
  group: assets-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # On main after a merge: nothing to do when the pull request's run passed on this
  # exact tree (tools/test_reuse.py same-tree).
  gate:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.tree.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/test_reuse.py same-tree
  prepare:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: build/runtime-assets
          # Only what feeds preparation: shared assets, each game's assets and manifest, the
          # engines' manifests and the tools. A miss restores the last runtime and the
          # preparation encodes only the sounds whose sources changed.
          key: runtime-v3-${{ hashFiles('assets/**', 'games/*/assets/**', 'games/*/GAME.json', 'shared/*/assets/**', 'shared/*/ENGINE.json', 'tools/*portable_assets.py', 'tools/game_catalog.py') }}
          restore-keys: runtime-v3-
      - name: Install authoring tools
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil
      - name: Prepare compact audio, fonts and artwork
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: /usr/bin/python3 tools/prepare_portable_assets.py --output build/runtime-assets --ffmpeg ffmpeg
      - name: Verify complete runtime inventory
        run: /usr/bin/python3 tools/verify_portable_assets.py --runtime build/runtime-assets
      - name: Archive platform-independent data
        run: tar -czf build/games-runtime-assets.tar.gz -C build/runtime-assets .
      - uses: actions/upload-artifact@v4
        with:
          name: games-runtime-data
          path: build/games-runtime-assets.tar.gz
          compression-level: 0
          if-no-files-found: error

  native-audio:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reviewed development audio source
        uses: actions/checkout@v4
        with:
          repository: falseywinchnet/gui_forms
          ref: 56e194f92adbdee2f29debda3a11287ae47cead5
          path: gui_forms
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
      # GUI.Forms publishes the MSYS2 tree its cache was compiled with; restoring it
      # avoids the MSYS2 mirrors and guarantees the compiler the cache needs.
      - name: Restore GUI.Forms' Windows toolchain
        id: msys
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/restore_windows_toolchain.py
      # Only when the published toolchain could not be restored.
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.msys.outputs.restored != 'true'
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm-tools mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-winpthreads git
      # GUI.Forms' LLVM 22 contract, as in the application workflow.
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Install macOS LLVM 22 compiler
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "OBJCXX=clang++" >> "$GITHUB_ENV"
          echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      - name: Restore GUI.Forms macOS 14 runtime
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/restore_toolkit_cache.py macos-arm64
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update && sudo apt-get install -y ninja-build clang-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: games-runtime-data
          path: build/data
      - name: Extract verified runtime data
        run: |
          mkdir -p build/runtime
          tar -xzf build/data/games-runtime-assets.tar.gz -C build/runtime
      # Pinned dependency sources (QuickJS, miniaudio) are fetched once and kept;
      # a changed pin repopulates only that dependency.
      - uses: actions/cache@v4
        with:
          path: |
            .build/fetch/*-src
            .build/fetch/*-subbuild
          key: fetch-v1-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tests/portable_*/CMakeLists.txt', 'gui_forms/cmake/Audio.cmake') }}
          restore-keys: fetch-v1-${{ matrix.platform }}-
      - name: Configure source-only audio consumer tests
        run: >-
          cmake -S tests/portable_audio -B build/audio -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DGUI_FORMS_BUILD_TESTS=ON
          -DGAMES_AUDIO_SOURCE_DIR="$PWD/gui_forms"
          -DCMAKE_TOOLCHAIN_FILE="$PWD/gui_forms/cmake/llvm22.cmake"
          -DFETCHCONTENT_BASE_DIR="$PWD/.build/fetch" -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
          -DGAMES_AUDIO_ASSET_DIR="$PWD/build/runtime"
      - name: Build shared audio and game adapters
        run: cmake --build build/audio --parallel 4
      - name: Test decoded audio and sample-clock transitions
        run: ctest --test-dir build/audio --output-on-failure --timeout 120 --output-junit results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-checks-${{ matrix.platform }}
          path: |
            build/audio/results.xml
            build/audio/Testing/Temporary/LastTest.log
          if-no-files-found: warn
