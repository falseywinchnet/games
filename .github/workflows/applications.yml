name: Build installable PlaySuite
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested packages from main
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: applications-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Select one tested publication version
        id: version
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: python3 tools/publication_version.py
      - name: Test module asset and release contracts
        run: python3 -m unittest discover -s tests -p test_modular_assets_release.py
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: build/runtime-assets
          key: runtime-v2-${{ hashFiles('assets/**', 'games/**', 'shared/**', 'tools/*portable_assets.py', 'tools/game_catalog.py') }}
      - name: Install authoring tools
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil
      - name: Prepare compact game resources
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: /usr/bin/python3 tools/prepare_portable_assets.py --output build/runtime-assets --ffmpeg ffmpeg
      - name: Check first-party C++ style
        run: python3 scripts/check-style.py
      - name: Verify and archive resources
        run: |
          /usr/bin/python3 tools/verify_portable_assets.py --runtime build/runtime-assets
          tar -czf build/runtime.tar.gz -C build/runtime-assets .
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: build/runtime.tar.gz
          compression-level: 0
  application:
    needs: prepare
    env:
      GAMES_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-amd64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reviewed GUI.Forms source
        uses: actions/checkout@v4
        with:
          repository: falseywinchnet/file_manager
          ref: 2ac5dcd84b8f5b0e241691e31880e36684e0cfcf
          path: toolkit
          sparse-checkout: gui_forms
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm-tools mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-nsis mingw-w64-clang-x86_64-ccache git
      - name: Install macOS C++20 compiler and runtime
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@20 ccache
          llvm_prefix="$(brew --prefix llvm@20)"
          echo "CXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
          echo "OBJCXX=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
          echo "CC=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-nostdinc++ -isystem $llvm_prefix/include/c++/v1" >> "$GITHUB_ENV"
          echo "OBJCXXFLAGS=-nostdinc++ -isystem $llvm_prefix/include/c++/v1" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$llvm_prefix/lib/c++ -Wl,-rpath,$llvm_prefix/lib/c++ -L$llvm_prefix/lib/unwind -Wl,-rpath,$llvm_prefix/lib/unwind -lunwind" >> "$GITHUB_ENV"
      - name: Install Linux compiler and desktop libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y clang ninja-build generate-ninja ccache
          libx11-dev libxcursor-dev libatk1.0-dev libatk-bridge2.0-dev
          libasound2t64 patchelf xvfb dpkg-dev
      - name: Fetch pinned text sources
        run: |
          sh toolkit/gui_forms/third_party/fetch_text_stack.sh
          sh toolkit/gui_forms/third_party/fetch_linebreak.sh
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: games-objects-v1-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**', 'games/**', 'shared/**') }}
          restore-keys: games-objects-v1-${{ matrix.platform }}-
      - name: Configure compiler cache
        run: |
          cache_dir="$PWD/.ccache"
          if command -v cygpath >/dev/null; then cache_dir="$(cygpath -m "$cache_dir")"; fi
          export CCACHE_DIR="$cache_dir"
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          ccache --max-size=500M
      - uses: actions/cache/restore@v4
        if: runner.os != 'Windows'
        id: skia
        with:
          path: toolkit/gui_forms/third_party/skia
          key: games-skia-7b260cf-v1-${{ matrix.platform }}
      - name: Build CPU renderer on Linux
        if: runner.os == 'Linux' && steps.skia.outputs.cache-hit != 'true'
        run: |
          GUI_FORMS_SYSTEM_BUILD_TOOLS=1 sh toolkit/gui_forms/third_party/fetch_skia_cpu.sh
          BUILD_JOBS=4 sh toolkit/gui_forms/third_party/build_skia_cpu_linux.sh "$PWD/toolkit/gui_forms/third_party/skia/out/games"
      - name: Build CPU renderer on macOS
        if: runner.os == 'macOS' && steps.skia.outputs.cache-hit != 'true'
        run: |
          sh toolkit/gui_forms/third_party/fetch_skia_cpu.sh
          skia="$PWD/toolkit/gui_forms/third_party/skia"
          mkdir -p "$skia/out/games"
          cp toolkit/gui_forms/third_party/skia_cpu_args.gn "$skia/out/games/args.gn"
          "$skia/bin/gn" gen "$skia/out/games" --root="$skia"
          "$skia/third_party/ninja/ninja" -C "$skia/out/games" -j4 skia
      - uses: actions/cache/save@v4
        if: runner.os != 'Windows' && steps.skia.outputs.cache-hit != 'true'
        with:
          path: toolkit/gui_forms/third_party/skia
          key: games-skia-7b260cf-v1-${{ matrix.platform }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime
          path: build/data
      - name: Configure complete application
        run: |
          mkdir -p build/runtime
          tar -xzf build/data/runtime.tar.gz -C build/runtime
          cmake -S . -B build/app -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DGAMES_TOOLKIT_SOURCE_DIR="$PWD/toolkit/gui_forms" \
            -DGAMES_RUNTIME_ASSET_DIR="$PWD/build/runtime" \
            -DGAMES_RELEASE_VERSION="$GAMES_RELEASE_VERSION" \
            -DGUI_FORMS_SKIA_PREBUILT=ON \
            -DGUI_FORMS_SKIA_OUT="$PWD/toolkit/gui_forms/third_party/skia/out/games"
      # Hosted runners are dedicated machines (4 cores on Linux and Windows, 3 on
      # macOS), unlike the shared development hosts AGENTS.md limits to two jobs.
      - name: Compile complete collection
        run: cmake --build build/app --parallel 4
      - name: Report Rock Stack stress benchmark
        continue-on-error: true
        run: ./build/app/rockstack_physics_tests performance
      - name: Test complete application
        run: ctest --test-dir build/app --output-on-failure --timeout 180 --parallel 4 --output-junit results.xml
      - name: Test Windows native queue ordering
        if: runner.os == 'Windows'
        run: |
          cmake -S toolkit/gui_forms -B build/message-tests -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGUI_FORMS_ENABLE_SKIA=OFF -DGUI_FORMS_ENABLE_WINDOWS_HOST=OFF \
            -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=OFF -DGUI_FORMS_BUILD_GALLERY=OFF \
            -DGUI_FORMS_BUILD_BENCHMARKS=OFF -DGUI_FORMS_BUILD_TESTS=ON
          cmake --build build/message-tests --target gui_forms_windows_message_queue_tests --parallel 4
          ctest --test-dir build/message-tests -R '^gui_forms_windows_message_queue_tests$' --output-on-failure
      - name: Package Windows application and installer
        if: runner.os == 'Windows'
        run: python tools/package_windows.py --build build/app --toolkit toolkit/gui_forms --runtime-dir /clang64/bin --installer
      - name: Package macOS application and installer
        if: runner.os == 'macOS'
        run: python3 tools/package_macos.py --build build/app --toolkit toolkit/gui_forms --llvm "$(brew --prefix llvm@20)"
      - name: Package Linux application and installer
        if: runner.os == 'Linux'
        run: python3 tools/package_linux.py --build build/app --toolkit toolkit/gui_forms
      - name: Launch packaged Windows application
        if: runner.os == 'Windows'
        run: |
          python tools/smoke_package.py dist/PlaySuite/games.exe
          python tools/test_windows_installer.py dist/*-setup.exe
      - name: Launch packaged macOS application
        if: runner.os == 'macOS'
        run: |
          python3 tools/smoke_package.py dist/PlaySuite.app/Contents/MacOS/games
          sudo /usr/sbin/installer -pkg dist/*.pkg -target /
          python3 tools/smoke_package.py /Applications/PlaySuite.app/Contents/MacOS/games
      - name: Record macOS puzzle presentation costs
        if: runner.os == 'macOS'
        run: |
          python3 tools/profile_presentation.py dist/PlaySuite.app/Contents/MacOS/games \
            --assets build/runtime --state build/profile-state \
            --output build/presentation-profile.json
      - name: Install and launch Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a python3 tools/smoke_package.py /usr/lib/rainstar-games/games
      - uses: actions/upload-artifact@v4
        with:
          name: games-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.pkg
            dist/*.deb
            dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-checks-${{ matrix.platform }}
          path: |
            build/app/results.xml
            build/app/Testing/Temporary/LastTest.log
            build/presentation-profile.json
          if-no-files-found: warn
  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, application]
    runs-on: ubuntu-24.04
    concurrency:
      group: playsuite-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: games-*
          merge-multiple: true
          path: dist
      - name: Publish exactly the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 tools/publish_tested_release.py --artifacts dist
