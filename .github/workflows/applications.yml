name: Build installable PlaySuite
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  # Every pull request, documentation included. This workflow holds every check of a
  # pull request (the others are called from it), and its "PlaySuite CI summary" job,
  # which always reports, is the one branch protection requires.
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested packages from main
        type: boolean
        default: false
permissions:
  contents: read
  actions: read  # tools/test_reuse.py reads earlier runs' results
# A newer push to a pull request cancels its older run. A main run is never cancelled,
# because it may be building a release; later main pushes queue behind it, and GitHub
# keeps only the newest of the queued ones.
concurrency:
  group: applications-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      text: ${{ steps.changes.outputs.text }}
      audio: ${{ steps.changes.outputs.audio }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's gate compares its head with the base it targets.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # The pinned template_harness (harness.lock) at ./template_harness: the house-style
      # checker and the Linux package profiles of its projects/games.toml.
      - uses: ./.github/actions/harness-checkout
      # The contribution gate (tools/check_contribution.py): source limits for the
      # games a pull request touches and, for a fork, the one-folder and code rules.
      - name: Check contributed games
        if: github.event_name == 'pull_request'
        run: >-
          python3 tools/check_contribution.py paths
          --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          ${{ github.event.pull_request.head.repo.full_name != github.repository && '--fork' || '' }}
      # The text and audio consumer checks run only for the changes that reach them.
      - name: Select the suites this change needs
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci_changes.py --base "$BASE" --head "$HEAD"
      - name: Select one tested publication version
        id: version
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: python3 tools/publication_version.py
      - name: Test module asset and release contracts
        run: python3 -m unittest discover -s tests -p test_modular_assets_release.py
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: build/runtime-assets
          # Only what feeds preparation: shared assets, each game's assets and manifest,
          # the engines' manifests and the tools. A miss restores the
          # last runtime and the preparation encodes only the sounds whose sources changed.
          key: runtime-v3-${{ hashFiles('assets/**', 'games/*/assets/**', 'games/*/GAME.json', 'shared/*/assets/**', 'shared/*/ENGINE.json', 'tools/*portable_assets.py', 'tools/game_catalog.py') }}
          restore-keys: runtime-v3-
      - name: Install authoring tools
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: sh template_harness/harness/install_linux_ci_packages.sh assets "$RUNNER_TEMP/apt-archives"
      # The verification reads the lake's reduced picture (Pillow) on a cache hit too.
      - name: Install the verifier's image reader
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - name: Prepare compact game resources
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: /usr/bin/python3 tools/prepare_portable_assets.py --output build/runtime-assets --ffmpeg ffmpeg
      # The harness's checker; scripts/check-style.py is the contributors' copy of it.
      - name: Check first-party C++ style
        run: python3 -B template_harness/harness/check_house_style.py src tests tools shared
      - name: Check each game's shipped size
        run: python3 tools/check_contribution.py prepared --runtime build/runtime-assets
      - name: Verify and archive resources
        run: |
          /usr/bin/python3 tools/verify_portable_assets.py --runtime build/runtime-assets
          tar -czf build/runtime.tar.gz -C build/runtime-assets .
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: build/runtime.tar.gz
          compression-level: 0
  application:
    needs: prepare
    env:
      GAMES_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      # The harness layout: .build/native-<platform>/<build_name>. Three levels below the
      # workspace, as GUI.Forms' own trees are, so the compiler cache it publishes matches.
      GAMES_BUILD_DIR: .build/native-${{ matrix.platform }}/games
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      # The pinned template_harness at ./template_harness: the Windows toolchain, the
      # Linux packages, the compiler check and the macOS runtime tools.
      - uses: ./.github/actions/harness-checkout
      # GUI.Forms lives in its own repository. It sits at gui_forms/, the same layout
      # as its own CI, so the compiler cache it publishes can match our objects.
      - name: Fetch reviewed GUI.Forms source
        uses: actions/checkout@v4
        with:
          repository: malkuth-software/gui_forms
          ref: e077f9d5a5117312e65e8c3b741c4edd24013d56
          path: gui_forms
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
      # GUI.Forms publishes the MSYS2 tree its cache was compiled with (the harness's
      # windows_toolchain.json names it; projects/games.toml reads GUI.Forms' releases).
      # Restoring it avoids the MSYS2 mirrors and guarantees the compiler the cache
      # needs; without a published tree the job stops rather than install another.
      - name: Restore GUI.Forms' Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/windows_toolchain.py restore
      # Name the compiler as GUI.Forms' CI does. CMake otherwise picks cc.exe and
      # c++.exe: the same Clang, but different files to ccache, so none of the
      # published cache would match.
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      # GUI.Forms' LLVM 22 contract: Homebrew llvm@22 compiles; the libc++, libc++abi
      # and libunwind the app ships are GUI.Forms' build of LLVM 22.1.8 for macOS
      # 14 (Homebrew's own require macOS 26). gui_forms/cmake/llvm22.cmake supplies
      # the flags, the arm64 architecture and the 14.0 minimum.
      - name: Install macOS LLVM 22 compiler
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@22 ccache
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "OBJCXX=clang++" >> "$GITHUB_ENV"
          echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      # Ubuntu's Clang 18 rejects current GUI.Forms; use the LLVM 22 series, as
      # GUI.Forms' own CI does, which also lets its compiler cache match.
      # The packages profile of projects/games.toml: the application's (compiler, X11,
      # ATK, ALSA, Xvfb) and the packaging tools. The downloaded Ubuntu packages are
      # kept per runner image; only main saves them.
      - name: Name the Linux package cache
        id: linux-image
        if: runner.os == 'Linux'
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: linux-packages
        if: runner.os == 'Linux'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: linux-debs-v1-packages-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/games.toml') }}-${{ steps.linux-image.outputs.image }}
          restore-keys: linux-debs-v1-packages-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/games.toml') }}-
      - name: Install Linux compiler and desktop libraries
        if: runner.os == 'Linux'
        run: |
          sh template_harness/harness/install_linux_ci_packages.sh packages "$RUNNER_TEMP/apt-archives"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.linux-packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      # Exactly LLVM 22.1.8 on every host, or the job stops here.
      - name: Verify the compiler
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py template_harness/harness/compiler_identity.py
      - name: Fetch pinned text sources
        run: |
          sh gui_forms/third_party/fetch_text_stack.sh
          sh gui_forms/third_party/fetch_linebreak.sh
      # GUI.Forms publishes a compiler cache (and on macOS its runtime) from each
      # tested main build. Restore the one for the pinned revision, checked against
      # its recorded digest; a miss only means compiling from source.
      - name: Restore GUI.Forms compiler cache and runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/restore_toolkit_cache.py "${{ matrix.platform }}" || python tools/restore_toolkit_cache.py "${{ matrix.platform }}"
      # Restore and save separately: the save runs right after a successful
      # compile, so a later test or packaging failure no longer discards it.
      # Windows failed late until 2026-10-06, never saved, and kept restoring
      # a GCC-era cache that clang could not use.
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .ccache
          key: games-objects-llvm22-v1-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**', 'games/**', 'shared/**') }}
          restore-keys: games-objects-llvm22-v1-${{ matrix.platform }}-
      - name: Configure compiler cache
        run: |
          cache_dir="$PWD/.ccache"
          if command -v cygpath >/dev/null; then cache_dir="$(cygpath -m "$cache_dir")"; fi
          cache_base="$PWD"
          if command -v cygpath >/dev/null; then cache_base="$(cygpath -m "$cache_base")"; fi
          export CCACHE_DIR="$cache_dir"
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$cache_base" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          ccache --max-size=900M
          ccache --zero-stats
      # Keyed on how GUI.Forms fetches and configures Skia, so a pin that builds it
      # differently (phase 7 dropped its font backend) never restores the old archive.
      - uses: actions/cache/restore@v4
        if: runner.os != 'Windows'
        id: skia
        with:
          path: gui_forms/third_party/skia
          key: games-skia-llvm22-v2-${{ matrix.platform }}-${{ hashFiles('gui_forms/third_party/fetch_skia_cpu.sh', 'gui_forms/third_party/build_skia_cpu*.sh', 'gui_forms/third_party/skia_cpu*.gn', 'gui_forms/third_party/skia_*.patch') }}
      - name: Build CPU renderer on Linux
        if: runner.os == 'Linux' && steps.skia.outputs.cache-hit != 'true'
        run: |
          GUI_FORMS_SYSTEM_BUILD_TOOLS=1 sh gui_forms/third_party/fetch_skia_cpu.sh
          BUILD_JOBS=4 sh gui_forms/third_party/build_skia_cpu_linux.sh "$PWD/gui_forms/third_party/skia/out/games"
      - name: Build CPU renderer on macOS
        if: runner.os == 'macOS' && steps.skia.outputs.cache-hit != 'true'
        run: |
          sh gui_forms/third_party/fetch_skia_cpu.sh
          BUILD_JOBS=4 sh gui_forms/third_party/build_skia_cpu.sh "$PWD/gui_forms/third_party/skia/out/games"
      - uses: actions/cache/save@v4
        if: runner.os != 'Windows' && steps.skia.outputs.cache-hit != 'true'
        with:
          path: gui_forms/third_party/skia
          key: ${{ steps.skia.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime
          path: build/data
      # Pinned dependency sources (QuickJS, miniaudio) are fetched once and kept;
      # a changed pin repopulates only that dependency.
      - uses: actions/cache@v4
        with:
          path: |
            .build/fetch/*-src
            .build/fetch/*-subbuild
          key: fetch-v1-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tests/portable_*/CMakeLists.txt', 'gui_forms/cmake/Audio.cmake') }}
          restore-keys: fetch-v1-${{ matrix.platform }}-
      - name: Configure complete application
        run: |
          mkdir -p build/runtime
          tar -xzf build/data/runtime.tar.gz -C build/runtime
          cmake -S . -B "$GAMES_BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/gui_forms/cmake/llvm22.cmake" \
            -DFETCHCONTENT_BASE_DIR="$PWD/.build/fetch" -DFETCHCONTENT_UPDATES_DISCONNECTED=ON \
            -DGAMES_TOOLKIT_SOURCE_DIR="$PWD/gui_forms" \
            -DGAMES_RUNTIME_ASSET_DIR="$PWD/build/runtime" \
            -DGAMES_RELEASE_VERSION="$GAMES_RELEASE_VERSION" \
            -DGUI_FORMS_SKIA_PREBUILT=ON \
            -DGUI_FORMS_SKIA_OUT="$PWD/gui_forms/third_party/skia/out/games"
      # Hosted runners are dedicated machines (4 cores on Linux and Windows, 3 on
      # macOS), unlike the shared development hosts AGENTS.md limits to two jobs.
      - name: Compile complete collection
        id: compile
        run: cmake --build "$GAMES_BUILD_DIR" --parallel 4
      # What each game's shipped code can call, on every platform, so code behind
      # a platform #ifdef is read too.
      - name: Check games' shipped code
        run: python3 tools/check_contribution.py symbols --build "$GAMES_BUILD_DIR" || python tools/check_contribution.py symbols --build "$GAMES_BUILD_DIR"
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose
      - uses: actions/cache/save@v4
        if: always() && steps.compile.outcome == 'success' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      # The benchmark and the presentation profile record numbers and gate
      # nothing, so they run for publications and manual runs only.
      - name: Report Rock Stack stress benchmark
        if: needs.prepare.outputs.publish == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: ./"$GAMES_BUILD_DIR"/rockstack_physics_tests performance
      # Tests whose inputs are unchanged since they last passed are not run again
      # (tools/test_reuse.py). Every release carries the results; each run starts from
      # the newest release's.
      - name: Fetch test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py tools/test_reuse.py fetch --results .build/test-results/test-results-app-${{ matrix.platform }}.json
      - name: Plan tests
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py tools/test_reuse.py plan --build "$GAMES_BUILD_DIR" --profile app-${{ matrix.platform }} \
            --results .build/test-results/test-results-app-${{ matrix.platform }}.json --exclude .build/test-results/exclude.txt
      - name: Test complete application
        run: |
          skip=$(cat .build/test-results/exclude.txt 2>/dev/null || true)
          ctest --test-dir "$GAMES_BUILD_DIR" --output-on-failure --timeout 180 --parallel 4 --output-junit results.xml --no-tests=ignore -LE design ${skip:+-E "$skip"}
      - name: Record test results
        if: always()
        run: |
          py=python3; command -v python3 >/dev/null || py=python
          $py tools/test_reuse.py record --build "$GAMES_BUILD_DIR" --profile app-${{ matrix.platform }} \
            --results .build/test-results/test-results-app-${{ matrix.platform }}.json --junit "$GAMES_BUILD_DIR"/results.xml
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-app-${{ matrix.platform }}
          path: .build/test-results/test-results-app-${{ matrix.platform }}.json
          if-no-files-found: ignore
      - name: Test Windows native queue ordering
        if: runner.os == 'Windows'
        run: |
          cmake -S gui_forms -B build/message-tests -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGUI_FORMS_ENABLE_SKIA=OFF -DGUI_FORMS_ENABLE_WINDOWS_HOST=OFF \
            -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=OFF -DGUI_FORMS_BUILD_GALLERY=OFF \
            -DGUI_FORMS_BUILD_BENCHMARKS=OFF -DGUI_FORMS_BUILD_TESTS=ON
          cmake --build build/message-tests --target gui_forms_windows_message_queue_tests --parallel 4
          ctest --test-dir build/message-tests -R '^gui_forms_windows_message_queue_tests$' --output-on-failure
      - name: Package Windows application and installer
        if: runner.os == 'Windows'
        run: python tools/package_windows.py --build "$GAMES_BUILD_DIR" --toolkit gui_forms --runtime-dir /clang64/bin --installer
      - name: Package macOS application and installer
        if: runner.os == 'macOS'
        run: python3 tools/package_macos.py --build "$GAMES_BUILD_DIR" --toolkit gui_forms --runtime "$GUI_FORMS_LLVM_RUNTIME"
      - name: Package Linux application and installer
        if: runner.os == 'Linux'
        run: python3 tools/package_linux.py --build "$GAMES_BUILD_DIR" --toolkit gui_forms
      - name: Launch packaged Windows application
        if: runner.os == 'Windows'
        run: |
          python tools/smoke_package.py dist/PlaySuite/games.exe
          python tools/test_windows_installer.py dist/*-setup.exe
      - name: Launch packaged macOS application
        if: runner.os == 'macOS'
        run: |
          python3 tools/smoke_package.py dist/PlaySuite.app/Contents/MacOS/games
          sudo /usr/sbin/installer -pkg dist/*.pkg -target /
          python3 tools/smoke_package.py /Applications/PlaySuite.app/Contents/MacOS/games
      - name: Record macOS puzzle presentation costs
        if: runner.os == 'macOS' && (needs.prepare.outputs.publish == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          python3 tools/profile_presentation.py dist/PlaySuite.app/Contents/MacOS/games \
            --assets build/runtime --state build/profile-state \
            --output build/presentation-profile.json
      # Installed over a stand-in for 0.5.x's rainstar-games, as an upgrade would be.
      - name: Install and launch Linux package
        if: runner.os == 'Linux'
        run: |
          python3 tools/test_deb_upgrade.py dist/*.deb
          xvfb-run -a python3 tools/smoke_package.py /usr/lib/playsuite/games
      - uses: actions/upload-artifact@v4
        with:
          name: games-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.pkg
            dist/*.deb
            dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-checks-${{ matrix.platform }}
          path: |
            ${{ env.GAMES_BUILD_DIR }}/results.xml
            ${{ env.GAMES_BUILD_DIR }}/Testing/Temporary/LastTest.log
            build/presentation-profile.json
          if-no-files-found: warn
  readme:
    uses: ./.github/workflows/readme.yml
  # The portable game cores on every host, for pull requests (the application jobs test
  # the same cores; a release takes these results from the merged pull request's run).
  core:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/native-core.yml
  text:
    needs: prepare
    if: needs.prepare.outputs.text == 'true'
    uses: ./.github/workflows/native-text.yml
  audio:
    needs: prepare
    if: needs.prepare.outputs.audio == 'true'
    uses: ./.github/workflows/runtime-assets.yml
  # Every core test under AddressSanitizer, UndefinedBehaviorSanitizer and LeakSanitizer
  # (tools/sanitize_core.py, with the harness's sanitizer options): any report fails it.
  sanitizers:
    name: Sanitizers (Linux, ASan + UBSan + LSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/harness-checkout
      - name: Name the Linux package cache
        id: linux-image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: linux-packages
        with:
          path: ${{ runner.temp }}/apt-archives
          key: linux-debs-v1-core-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/games.toml') }}-${{ steps.linux-image.outputs.image }}
          restore-keys: linux-debs-v1-core-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/games.toml') }}-
      - name: Install the compiler and build tools
        run: sh template_harness/harness/install_linux_ci_packages.sh core "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.linux-packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      - name: Verify the compiler
        run: python3 template_harness/harness/compiler_identity.py
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .ccache
          key: games-sanitize-ccache-linux-x64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'tests/**', 'games/**', 'shared/**') }}
          restore-keys: games-sanitize-ccache-linux-x64-v1-
      - uses: actions/cache@v4
        with:
          path: |
            .build/fetch/*-src
            .build/fetch/*-subbuild
          key: fetch-sanitize-v1-linux-x64-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}
          restore-keys: fetch-sanitize-v1-linux-x64-
      - name: Build and test the sanitized core
        id: sanitize
        run: |
          export CCACHE_DIR="$PWD/.ccache" CCACHE_BASEDIR="$PWD" CCACHE_COMPILERCHECK=content
          ccache --max-size=500M
          ccache --zero-stats
          python3 tools/sanitize_core.py --platform linux-x64 --jobs 4 \
            --define FETCHCONTENT_BASE_DIR="$PWD/.build/fetch" --define FETCHCONTENT_UPDATES_DISCONNECTED=ON
          ccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.sanitize.outcome == 'success' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sanitizer-checks-linux-x64
          path: .build/native-linux-x64/games-core-sanitize/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, application]
    runs-on: ubuntu-24.04
    concurrency:
      group: playsuite-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: games-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-app-*
          merge-multiple: true
          path: test-results
      # The release carries every profile's test results: the game-core workflow's from
      # the merged pull request's run, otherwise the previous release's.
      - name: Collect test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/test_reuse.py collect --results test-results --workflow applications.yml --expect \
            test-results-app-windows-x64.json test-results-app-macos-arm64.json \
            test-results-app-linux-x64.json test-results-app-linux-arm64.json \
            test-results-core-windows-x64.json test-results-core-macos-arm64.json \
            test-results-core-linux-x64.json test-results-core-linux-arm64.json
      - name: Publish exactly the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 tools/publish_tested_release.py --artifacts dist --test-results test-results
  # The one check branch protection requires. It always reports, for every pull request
  # and push, and fails when any job above failed or was cancelled; a job this change
  # does not need (text, audio), and the release outside publications, is skipped.
  summary:
    name: PlaySuite CI summary
    if: always()
    needs: [prepare, application, readme, core, text, audio, sanitizers, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          results = json.load(sys.stdin)
          failed = 0
          for job in sorted(results):
              result = results[job]["result"]
              print(job + ": " + result)
              if result not in ("success", "skipped"):
                  failed += 1
          sys.exit(1 if failed else 0)
          '
