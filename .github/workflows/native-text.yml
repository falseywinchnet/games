name: Native portable text
on:
  push:
    branches: [main]
    paths: ['src/text_requests.*', 'src/game_text.*', 'src/bar_music.*', 'assets/fonts/**', 'games/eggy/**', 'games/fourpegs/**', 'games/atomprobe/**', 'games/switchbox/**', 'tests/*frame*', 'tests/*text*', 'tests/portable_text/**', 'tools/restore_*.py', 'tools/package_common.py', '.github/workflows/native-text.yml']
  pull_request:
    paths: ['src/text_requests.*', 'src/game_text.*', 'src/bar_music.*', 'assets/fonts/**', 'games/eggy/**', 'games/fourpegs/**', 'games/atomprobe/**', 'games/switchbox/**', 'tests/*frame*', 'tests/*text*', 'tests/portable_text/**', 'tools/restore_*.py', 'tools/package_common.py', '.github/workflows/native-text.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read  # tools/test_reuse.py reads earlier runs' results
concurrency:
  group: text-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  # On main after a merge: nothing to do when the pull request's run passed on this
  # exact tree (tools/test_reuse.py same-tree).
  gate:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.tree.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/test_reuse.py same-tree
  native-text:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      # The pinned template_harness (harness.lock) at ./template_harness.
      - uses: ./.github/actions/harness-checkout
      - name: Fetch reviewed development text source
        uses: actions/checkout@v4
        with:
          repository: malkuth-software/gui_forms
          ref: e077f9d5a5117312e65e8c3b741c4edd24013d56
          path: gui_forms
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
      # GUI.Forms publishes the MSYS2 tree its cache was compiled with (the harness's
      # windows_toolchain.json names it; projects/games.toml reads GUI.Forms' releases).
      # Restoring it avoids the MSYS2 mirrors and guarantees the compiler the cache
      # needs; without a published tree the job stops rather than install another.
      - name: Restore GUI.Forms' Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/windows_toolchain.py restore
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      # GUI.Forms' LLVM 22 contract, as in the application workflow.
      - name: Install macOS LLVM 22 compiler
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@22 ccache
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "OBJCXX=clang++" >> "$GITHUB_ENV"
          echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      # The same GUI.Forms compiler cache (and on macOS its runtime) as the
      # application build, under the same layout, plus this check's own objects.
      - name: Install Linux tools
        if: runner.os == 'Linux'
        # Current GUI.Forms needs the LLVM 22 series (Ubuntu's compilers reject it).
        run: |
          sh template_harness/harness/install_linux_ci_packages.sh core "$RUNNER_TEMP/apt-archives"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Restore GUI.Forms compiler cache and runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          platform="${{ matrix.platform }}"
          python3 tools/restore_toolkit_cache.py "$platform" || python tools/restore_toolkit_cache.py "$platform"
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .ccache
          key: text-objects-v1-${{ matrix.platform }}-${{ hashFiles('src/text_requests.*', 'src/game_text.*', 'src/bar_music.*', 'games/**', 'shared/**', 'tests/portable_text/**') }}
          restore-keys: text-objects-v1-${{ matrix.platform }}-
      - name: Configure compiler cache
        run: |
          cache_dir="$PWD/.ccache"
          cache_base="$PWD"
          if command -v cygpath >/dev/null; then cache_dir="$(cygpath -m "$cache_dir")"; cache_base="$(cygpath -m "$cache_base")"; fi
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$cache_base" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          CCACHE_DIR="$cache_dir" ccache --max-size=900M
          CCACHE_DIR="$cache_dir" ccache --zero-stats
      - name: Fetch pinned native text dependencies
        run: |
          sh gui_forms/third_party/fetch_text_stack.sh
          sh gui_forms/third_party/fetch_linebreak.sh
      # Pinned dependency sources (QuickJS, miniaudio) are fetched once and kept;
      # a changed pin repopulates only that dependency.
      - uses: actions/cache@v4
        with:
          path: |
            .build/fetch/*-src
            .build/fetch/*-subbuild
          key: fetch-v1-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'tests/portable_*/CMakeLists.txt', 'gui_forms/cmake/Audio.cmake') }}
          restore-keys: fetch-v1-${{ matrix.platform }}-
      - name: Configure public-API text consumer
        run: >-
          cmake -S tests/portable_text -B .build/native/text -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DGAMES_TEST_VENDOR_FRAMES=ON -DGAMES_TEXT_SOURCE_DIR="$PWD/gui_forms"
          -DCMAKE_TOOLCHAIN_FILE="$PWD/gui_forms/cmake/llvm22.cmake"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          -DFETCHCONTENT_BASE_DIR="$PWD/.build/fetch" -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - name: Build native masks and Games adapters
        id: compile
        run: cmake --build .build/native/text --target text_request_tests text_native_consumer_tests game_text_frame_tests vendor_game_frame_tests --parallel 4
      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose
      - uses: actions/cache/save@v4
        if: always() && steps.compile.outcome == 'success' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Test lifecycle and actual native text
        run: ctest --test-dir .build/native/text --output-on-failure --timeout 120 --output-junit results.xml -R '^(text_request_lifecycle|text_native_consumer|game_text_frame_preparation|.+_native_frames)$'
      - name: Render actual text previews
        run: |
          .build/native/text/text_native_consumer_tests gui_forms/assets/fonts .build/native/text/previews
          for game in fourpegs atomprobe switchbox eggy; do
            .build/native/text/vendor_game_frame_tests assets "$game" .build/native/text/previews
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-checks-${{ matrix.platform }}
          path: |
            .build/native/text/results.xml
            .build/native/text/Testing/Temporary/LastTest.log
            .build/native/text/previews/*
          if-no-files-found: warn
