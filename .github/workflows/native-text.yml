name: Native portable text
on:
  push:
    branches: [main]
    paths: ['src/text_requests.*', 'src/game_text.*', 'games/**', 'shared/**', 'tests/*frame*', 'tests/*text*', 'tests/portable_text/**', '.github/workflows/native-text.yml']
  pull_request:
    paths: ['src/text_requests.*', 'src/game_text.*', 'games/**', 'shared/**', 'tests/*frame*', 'tests/*text*', 'tests/portable_text/**', '.github/workflows/native-text.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: text-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native-text:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch reviewed development text source
        uses: actions/checkout@v4
        with:
          repository: falseywinchnet/gui_forms
          ref: f57d0faa050f47b819f2f9e7dcfc2ab84fe4cb2b
          path: gui_forms
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-llvm-tools mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-winpthreads git
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      # GUI.Forms' LLVM 22 contract, as in the application workflow.
      - name: Install macOS LLVM 22 compiler
        if: runner.os == 'macOS'
        run: |
          brew install ninja llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "OBJCXX=clang++" >> "$GITHUB_ENV"
          echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      - name: Restore GUI.Forms macOS 14 runtime
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/restore_toolkit_cache.py macos-arm64
      - name: Install Linux tools
        if: runner.os == 'Linux'
        # Current GUI.Forms needs the LLVM 22 series (Ubuntu's compilers reject it).
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update && sudo apt-get install -y ninja-build clang-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Fetch pinned native text dependencies
        run: |
          sh gui_forms/third_party/fetch_text_stack.sh
          sh gui_forms/third_party/fetch_linebreak.sh
      - name: Configure public-API text consumer
        run: >-
          cmake -S tests/portable_text -B build/text -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DGAMES_TEST_VENDOR_FRAMES=ON -DGAMES_TEXT_SOURCE_DIR="$PWD/gui_forms"
          -DCMAKE_TOOLCHAIN_FILE="$PWD/gui_forms/cmake/llvm22.cmake"
      - name: Build native masks and Games adapters
        run: cmake --build build/text --target text_request_tests text_native_consumer_tests game_text_frame_tests vendor_game_frame_tests --parallel 4
      - name: Test lifecycle and actual native text
        run: ctest --test-dir build/text --output-on-failure --timeout 120 --output-junit results.xml -R '^(text_request_lifecycle|text_native_consumer|game_text_frame_preparation|.+_native_frames)$'
      - name: Render actual text previews
        run: |
          build/text/text_native_consumer_tests gui_forms/assets/fonts build/text/previews
          for game in fourpegs atomprobe switchbox eggy; do
            build/text/vendor_game_frame_tests assets "$game" build/text/previews
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-checks-${{ matrix.platform }}
          path: |
            build/text/results.xml
            build/text/Testing/Temporary/LastTest.log
            build/text/previews/*
          if-no-files-found: warn
